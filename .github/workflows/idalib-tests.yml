name: Provider tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e . pytest jsonschema mcp coverage
      - name: Run tests that do not require an IDA license
        run: .venv/bin/python -m pytest -q tests
# Live IDA 9.4 validation is opt-in: tests/ida_provider_smoke.py.
# No proprietary IDA image or license is distributed by this fork.
